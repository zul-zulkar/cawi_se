<!-- ====== PASSWORD GATE ====== -->
<div id="pwGate">
  <div class="pw-card">
    <div class="pw-title">CAWI</div>
    <div class="pw-subtitle">SE2026 — BPS Buleleng</div>
    <div class="pw-restricted"><i class="bi bi-shield-lock-fill"></i> AKSES TERBATAS — PETUGAS BPS</div>
    <input type="password" id="pwInput" class="pw-input" placeholder="Masukkan kata sandi"
      onkeydown="if(event.key==='Enter')checkPassword()"/>
    <div id="pwError"><i class="bi bi-exclamation-circle-fill"></i> Kata sandi salah</div>
    <button type="button" class="pw-btn" onclick="checkPassword()"><i class="bi bi-unlock-fill"></i> Masuk</button>
    <p class="pw-note">Hanya untuk petugas pencacah resmi<br/>Sensus Ekonomi 2026 BPS Buleleng</p>
  </div>
</div>

<!-- Mode pre-selector 2-gate (L vs L.UB) DIHAPUS: semua assignment kini
     memakai unified P. Mode legacy ditentukan deterministik dari ?mode= oleh guard. -->
