<!-- ============================================================
     ASSIGNMENT GUARD — wajib dimuat dari Portal Petugas (index.html).
     Kuesioner HANYA bisa dibuka via ?draft=cawi_..._<uuid>&mode=L|LUB
     yang cocok dengan entry di localStorage `cawi_assignments`.
     Tanpa itu → redirect ke index.html (portal).

     Selain guard, partial ini juga:
     - Mirror LS_KEY (cawi_se2026_draft_v1) ke draft_key per-assignment
       SECARA REAL-TIME via Storage proxy. Ini fix masalah draft hilang
       saat refresh / pindah halaman karena race condition timing.
     - Pre-fill draft dari data assignment (nama responden + kode wilayah)
       saat assignment baru pertama kali dibuka.
     - Sinkronkan status assignment → "submitted" saat submit sukses,
       lalu redirect kembali ke portal.
     ============================================================ -->
<script>
(function () {
  'use strict';
  var PORTAL_URL        = 'index.html';
  var AUTH_KEY          = 'cawi_auth_v1';
  var FORM_MODE_KEY     = 'cawi_form_mode';
  var ASSIGNMENT_KEY    = 'cawi_assignments';
  var GLOBAL_DRAFT_KEY  = 'cawi_se2026_draft_v1';

  function backToPortal() { window.location.replace(PORTAL_URL); }

  // 1) Wajib sudah auth lewat portal
  if (sessionStorage.getItem(AUTH_KEY) !== '1') return backToPortal();

  // Bypass guard untuk workflow admin dari daftar.html:
  // - edit/duplicate record yang sudah tersubmit (cawi_edit_mode)
  // - lanjutkan draft (cawi_draft_continue_id)
  // Workflow ini tidak melalui assignment; auth tetap wajib.
  if (localStorage.getItem('cawi_edit_mode') ||
      localStorage.getItem('cawi_draft_continue_id')) {
    return;
  }

  // 2) Wajib ada ?draft= dan ?mode= di URL
  var params   = new URLSearchParams(window.location.search);
  var draftKey = params.get('draft');
  var modeRaw  = params.get('mode');
  if (!draftKey || !modeRaw) return backToPortal();

  // 3) Draft key wajib match assignment yang valid
  var assigns;
  try { assigns = JSON.parse(localStorage.getItem(ASSIGNMENT_KEY) || '[]'); }
  catch (e) { return backToPortal(); }
  var found = null;
  for (var i = 0; i < assigns.length; i++) {
    if (assigns[i] && assigns[i].draft_key === draftKey) { found = assigns[i]; break; }
  }
  if (!found) return backToPortal();

  // 4) Set mode form sebelum mode-gate logic jalan
  // Unified (SE2026-P): ?mode=P / UNIFIED → Blok P + L/L.UB satu halaman.
  // Mode dasar (l/lub) tetap di-set untuk reuse logika collect/validation existing.
  var isUnified = (modeRaw === 'P' || modeRaw === 'p' || modeRaw === 'UNIFIED' || modeRaw === 'unified');
  var mode = (modeRaw === 'L' || modeRaw === 'l') ? 'l' : 'lub';
  localStorage.setItem(FORM_MODE_KEY, mode);

  // Expose ke window untuk dipakai listener lain (submit.js hook)
  window.__cawiActiveAssignment = found;
  window.__cawiActiveDraftKey   = draftKey;
  window.__cawiUnified          = isUnified;

  // ============================================================
  // 5) STORAGE PROXY: setiap write ke GLOBAL_DRAFT_KEY otomatis
  //    di-mirror ke draftKey per-assignment. Ini menjamin draft
  //    tetap tersinkron tanpa bergantung pada interval/beforeunload
  //    (yang punya race condition saat user refresh cepat).
  // ============================================================
  var origSetItem    = Storage.prototype.setItem;
  var origRemoveItem = Storage.prototype.removeItem;
  Storage.prototype.setItem = function (key, value) {
    origSetItem.call(this, key, value);
    if (this === window.localStorage && key === GLOBAL_DRAFT_KEY) {
      try { origSetItem.call(this, draftKey, value); } catch (e) {}
    }
  };
  Storage.prototype.removeItem = function (key) {
    origRemoveItem.call(this, key);
    // Jangan auto-hapus draftKey saat global draft di-clear (clearDraft
    // dipanggil oleh submit-success hook secara terkontrol)
  };

  // ============================================================
  // 6) MUAT draft per-assignment ke global key SEBELUM form load.
  //    Kalau belum ada draft tersimpan, pre-fill dari assignment.
  // ============================================================
  function buildPrefillVals(assignment) {
    var vals = {};
    vals._formMode = mode;
    vals._ts       = new Date().toISOString();
    // Unified (SE2026-P): prefill Blok P (nama entitas). Wilayah ikut ke stage L/L.UB
    // di bawah; field wilayah Blok P diambil dari assignment saat collectDataP().
    if (isUnified && assignment.nama_responden) {
      vals['pmt_nama'] = assignment.nama_responden;
    }
    if (mode === 'l') {
      // L mode (Rumah Tangga): nama_kk + wilayah keluarga + SLS
      if (assignment.nama_responden) vals['l1_nama_kk'] = assignment.nama_responden;
      if (assignment.provinsi_kd)    vals['l1_alamat_provinsi'] = assignment.provinsi_kd;
      if (assignment.kabupaten_kd)   vals['l1_alamat_kab']      = assignment.kabupaten_kd;
      if (assignment.kecamatan_kd)   vals['l1_alamat_kec']      = assignment.kecamatan_kd;
      if (assignment.desa_kd)        vals['l1_alamat_kel']      = assignment.desa_kd;
      // SLS (banjar/dusun/lingkungan). Kalau ada subsls != 00, embed di nama
      // supaya petugas tahu pembagian wilayahnya.
      if (assignment.sls_full_kd) {
        var sub = assignment.subsls_kd && assignment.subsls_kd !== '00'
          ? assignment.sls_full_kd + assignment.subsls_kd
          : assignment.sls_full_kd;
        vals['l1_kode_sls'] = sub;
      }
      if (assignment.sls_nama) {
        var subTag = assignment.subsls_kd && assignment.subsls_kd !== '00'
          ? ' (SubSLS ' + assignment.subsls_kd + ')'
          : '';
        vals['l1_nama_sls'] = assignment.sls_nama + subTag;
      }
    } else {
      // L.UB mode (Usaha Besar): nama perusahaan + wilayah Blok I
      if (assignment.nama_responden) vals['q5a_nama_perusahaan'] = assignment.nama_responden;
      if (assignment.provinsi_kd)    vals['q1_provinsi']  = assignment.provinsi_kd;
      if (assignment.kabupaten_kd)   vals['q2_kabupaten'] = assignment.kabupaten_kd;
      if (assignment.kecamatan_kd)   vals['q3_kecamatan'] = assignment.kecamatan_kd;
      if (assignment.desa_kd)        vals['q4_kelurahan'] = assignment.desa_kd;
    }
    return vals;
  }

  try {
    var perAssign = localStorage.getItem(draftKey);
    if (perAssign) {
      // Draft tersimpan untuk assignment ini → restore ke global key
      origSetItem.call(localStorage, GLOBAL_DRAFT_KEY, perAssign);
    } else {
      // Pertama kali dibuka → pre-fill dari data assignment
      var prefill = buildPrefillVals(found);
      var serialized = JSON.stringify(prefill);
      origSetItem.call(localStorage, GLOBAL_DRAFT_KEY, serialized);
      origSetItem.call(localStorage, draftKey, serialized);
    }
  } catch (e) {}

  // ============================================================
  // 7) POST-SUBMIT HOOK
  //    - Set status assignment → submitted, simpan record_id (untuk
  //      edit by cawi_id berikutnya) jika backend mengembalikannya.
  //    - Hapus draft per-assignment.
  //    - Redirect ke portal.
  // ============================================================
  window.addEventListener('cawi:submit-success', function (ev) {
    try {
      var list = JSON.parse(localStorage.getItem(ASSIGNMENT_KEY) || '[]');
      var nowIso = new Date().toISOString();
      for (var j = 0; j < list.length; j++) {
        if (list[j] && list[j].draft_key === draftKey) {
          list[j].status     = 'submitted';
          list[j].updated_at = nowIso;
          if (ev && ev.detail && ev.detail.record_id) {
            list[j].record_id = ev.detail.record_id;
          }
          break;
        }
      }
      // Gunakan origSetItem agar TIDAK kena proxy mirror
      origSetItem.call(localStorage, ASSIGNMENT_KEY, JSON.stringify(list));
      // JANGAN hapus draft_key per-assignment: dipertahankan sebagai snapshot
      // hasil submit supaya assignment yang dibuka lagi ter-restore PENUH
      // (bukan kosong). Hanya global key yang dibuang (di-rebuild dari draft_key
      // saat reopen). Re-submit menimpa baris yang sama via cawi_id/record_id.
      origRemoveItem.call(localStorage, GLOBAL_DRAFT_KEY);
    } catch (e) {}
    setTimeout(backToPortal, 1500);
  });

  // ============================================================
  // 8) READ-ONLY LOCK untuk assignment ber-status "submitted".
  //    Hanya bisa DILIHAT. Untuk mengedit, petugas mengubah status ke
  //    "Editing" di Portal (status 'editing'/'draft' → tidak terkunci).
  // ============================================================
  function _notifyLocked() {
    alert('Kuesioner ini sudah DIKIRIM dan terkunci.\n\n' +
      'Untuk mengubah: buka Portal Petugas, lalu klik "Aktifkan Edit" pada ' +
      'assignment ini (statusnya akan menjadi "Editing").');
  }

  function _injectReadonlyBanner() {
    if (document.getElementById('cawiReadonlyBanner')) return;
    // Blokir interaksi pada area form (termasuk widget kustom: searchable-select,
    // tanda tangan, unggah foto, tombol roster) — readOnly saja tak cukup untuk
    // widget berbasis JS. Navigasi sidebar (di luar form) tetap berfungsi.
    var st = document.createElement('style');
    st.id = 'cawiReadonlyStyle';
    st.textContent = 'body.cawi-readonly #form-l, body.cawi-readonly #form-p{pointer-events:none}' +
      'body.cawi-readonly #form-l input, body.cawi-readonly #form-l select, body.cawi-readonly #form-l textarea,' +
      'body.cawi-readonly #form-p input, body.cawi-readonly #form-p select, body.cawi-readonly #form-p textarea{background:#f8fafc;color:#334155}';
    document.head.appendChild(st);
    var bar = document.createElement('div');
    bar.id = 'cawiReadonlyBanner';
    bar.setAttribute('style', 'position:sticky;top:0;z-index:1300;background:#b91c1c;' +
      'color:#fff;padding:9px 14px;font-size:13px;font-weight:600;text-align:center;' +
      'box-shadow:0 2px 8px rgba(0,0,0,.25)');
    bar.innerHTML = '🔒 Mode LIHAT — kuesioner sudah dikirim. ' +
      'Untuk mengedit, aktifkan <b>Editing</b> di Portal Petugas.';
    if (document.body) document.body.insertBefore(bar, document.body.firstChild);
  }

  function _lockScope(scope) {
    if (!scope) return;
    var els = scope.querySelectorAll('input, select, textarea');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      var t = (el.type || '').toLowerCase();
      if (el.tagName === 'SELECT' || t === 'radio' || t === 'checkbox' || t === 'file') {
        el.disabled = true;
      } else {
        el.readOnly = true;
      }
    }
  }

  var _submitNeutralized = false;
  function applyReadOnlyLock() {
    if (!found || found.status !== 'submitted') return;
    window.__cawiReadOnly = true;                 // dibaca draft.js (cegah downgrade status)
    if (document.body) document.body.classList.add('cawi-readonly');
    _lockScope(document.getElementById('form-l'));
    _lockScope(document.getElementById('form-p'));

    var sb = document.getElementById('l5_submitBtn');
    if (sb) { sb.textContent = '🔒 Sudah dikirim'; sb.disabled = true; }

    // Neutralkan jalur submit (showRecap dari topbar/mobile/blok5 & confirmSubmit).
    if (!_submitNeutralized) {
      if (typeof window.showRecap === 'function')    window.showRecap    = _notifyLocked;
      if (typeof window.confirmSubmit === 'function') window.confirmSubmit = _notifyLocked;
      _submitNeutralized = true;
    }
    _injectReadonlyBanner();
  }

  if (window.addEventListener) {
    window.addEventListener('load', function () {
      // Setelah init + restoreDraft selesai. Ulangi sekali untuk menangkap
      // render roster (anggota/usaha) yang berjalan asinkron.
      setTimeout(applyReadOnlyLock, 250);
      setTimeout(applyReadOnlyLock, 1200);
    });
  }
})();
</script>
